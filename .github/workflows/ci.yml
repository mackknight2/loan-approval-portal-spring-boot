name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run all tests
        run: mvn -B clean verify

      - name: Publish coverage in job summary
        if: always()
        run: |
          CSV=target/site/jacoco/jacoco.csv
          if [ ! -f "$CSV" ]; then
            echo "No JaCoCo report was produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          awk -F, 'NR > 1 { missed += $8; covered += $9 }
            END {
              total = missed + covered
              printf "### Line coverage (hand-written code)\n\n"
              printf "**%.2f%%** (%d of %d lines covered). Code generated from the WSDL files is excluded.\n", (total ? 100 * covered / total : 0), covered, total
            }' "$CSV" >> "$GITHUB_STEP_SUMMARY"
          for f in target/surefire-reports/TEST-*.xml; do
            [ -f "$f" ] || continue
            grep -o '<testsuite [^>]*>' "$f"
          done | awk '{
              match($0, /tests="[0-9]+"/);    t += substr($0, RSTART + 7, RLENGTH - 8)
              match($0, /failures="[0-9]+"/); f += substr($0, RSTART + 10, RLENGTH - 11)
              match($0, /errors="[0-9]+"/);   e += substr($0, RSTART + 8, RLENGTH - 9)
              match($0, /skipped="[0-9]+"/);  s += substr($0, RSTART + 9, RLENGTH - 10)
            }
            END { printf "\n### Tests\n\n%d passed of %d (failures: %d, errors: %d, skipped: %d)\n", t - f - e - s, t, f, e, s }' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: warn
